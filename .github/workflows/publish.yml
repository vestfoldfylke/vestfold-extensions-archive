name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-nuget-package:
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || 
      (github.event_name == 'release' && github.event.release.target_commitish == 'main')
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC (trusted publisher setup)
      contents: read

    steps:
      - name: Publish NuGet package
        uses: vestfoldfylke/shared/.github/actions/nuget-publish@7ae467388c2478dbe10d4c911831c070a44e725b # v1.3.9
        with:
          nuget_user: ${{ secrets.NUGET_USER }}
          dotnet_version: "10.0.x"
          framework_version: "net10.0"
          project_path: "Vestfold.Extensions.Archive"
